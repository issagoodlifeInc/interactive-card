<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/styles.css" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Interactive card details form</title>
  </head>
  <body>
    <main>
      <section class="card-area" aria-label="Card preview">
        <div class="card-stack">
          <div class="back__card">
            <img src="./assets/images/bg-card-back.png" alt="" />
            <p class="card__cvc">000</p>
          </div>
          <div class="front__card">
            <img src="./assets/images/bg-card-front.png" alt="" />
            <span class="card-logo" aria-hidden="true"></span>
            <p class="card__number">0000 0000 0000 0000</p>
            <div class="front__bottom">
              <p class="card__name">Jane Appleseed</p>
              <p class="card__exp"><span class="card__month">00</span>/<span class="card__year">00</span></p>
            </div>
          </div>
        </div>
      </section>

      <section class="form-panel" aria-label="Card details">
        <form id="card-form" novalidate>
          <div class="field">
            <label for="name">Cardholder name</label>
            <input type="text" name="name" id="name" placeholder="e.g. Jane Appleseed" autocomplete="cc-name" aria-describedby="name-error" />
            <p class="error-message" id="name-error"></p>
          </div>
          <div class="field">
            <label for="cardnumber">Card number</label>
            <input type="text" name="cardnumber" id="cardnumber" placeholder="e.g. 1234 5678 9123 0000" inputmode="numeric" autocomplete="cc-number" maxlength="19" aria-describedby="number-error" />
            <p class="error-message" id="number-error"></p>
          </div>
          <div class="form-row">
            <fieldset class="expiry-fields">
              <legend>Exp. date (MM/YY)</legend>
              <div class="expiry-inputs">
                <div class="field">
                  <label class="visually-hidden" for="expiryMonth">Expiration month</label>
                  <input type="text" name="month" id="expiryMonth" placeholder="MM" inputmode="numeric" autocomplete="cc-exp-month" maxlength="2" aria-describedby="expiry-error" />
                </div>
                <div class="field">
                  <label class="visually-hidden" for="expiryYear">Expiration year</label>
                  <input type="text" name="year" id="expiryYear" placeholder="YY" inputmode="numeric" autocomplete="cc-exp-year" maxlength="2" aria-describedby="expiry-error" />
                </div>
              </div>
              <p class="error-message" id="expiry-error"></p>
            </fieldset>
            <div class="field cvc-field">
              <label for="cvc">CVC</label>
              <input type="text" name="cvc" id="cvc" placeholder="e.g. 123" inputmode="numeric" autocomplete="cc-csc" maxlength="3" aria-describedby="cvc-error" />
              <p class="error-message" id="cvc-error"></p>
            </div>
          </div>
          <button class="btn btn__submit" type="submit">Confirm</button>
        </form>

        <section class="thanks" aria-labelledby="thanks-title" hidden>
          <img src="./assets/images/icon-complete.svg" alt="" />
          <h1 class="thanks__title" id="thanks-title">Thank you!</h1>
          <p class="thanks__body">We've added your card details</p>
          <button class="btn btn__thanks" type="button">Continue</button>
        </section>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noreferrer"
        >Frontend Mentor</a
      >. Coded by <a href="#">Lesley Kimutai</a>.
    </footer>

    <script src="assets/main.js"></script>
  </body>
</html>
